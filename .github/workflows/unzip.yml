name: Zip uitpakken
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Websitebestanden uitpakken
        run: |
          if [ -f bodibeautybrows-vercel.zip ]; then
            unzip -o bodibeautybrows-vercel.zip -d .
            git rm -q bodibeautybrows-vercel.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Websitebestanden uitgepakt"
            git push
          fi
